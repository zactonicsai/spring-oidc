{{- $root := . -}}
{{- range $svcName, $svc := .Values.services }}
{{- if eq (include "app.isPublic" $svc) "true" }}
{{- $port0 := index $svc.ports 0 }}
---
# `helm test <release> -n <ns>` runs this pod: it must be able to reach every PUBLIC service.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "app.svcname" (list $root $svcName) }}-test
  namespace: {{ $root.Values.namespace }}
  labels:
    {{- include "app.labels" (list $root $svcName) | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      command: ["curl", "-fsS", "--max-time", "10",
                "http://{{ include "app.svcname" (list $root $svcName) }}:{{ default $port0.containerPort $port0.servicePort }}{{ default "/health" (default dict $svc.health).path }}"]
{{- end }}
{{- end }}
