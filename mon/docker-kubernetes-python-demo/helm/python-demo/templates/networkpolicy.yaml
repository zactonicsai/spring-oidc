{{- if .Values.networkPolicy.enabled }}
{{- $root := . -}}
{{- if .Values.networkPolicy.defaultDeny }}
---
# 1) Nobody may talk to any pod in this namespace ... unless a later policy allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.name" . }}-default-deny-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
{{- end }}
{{- range $svcName, $svc := .Values.services }}
{{- $isPublic := eq (include "app.isPublic" $svc) "true" }}
---
# 2) Allow-list for {{ $svcName }}: public ports from anywhere, other ports only from services[].network.allowFrom
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.svcname" (list $root $svcName) }}-allow
  namespace: {{ $root.Values.namespace }}
  labels:
    {{- include "app.labels" (list $root $svcName) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" (list $root $svcName) | nindent 6 }}
  policyTypes: ["Ingress"]
  {{- if or $isPublic $svc.allowFrom }}
  ingress:
    {{- if $isPublic }}
    - from:
        - namespaceSelector: {}          # any pod in any namespace (e.g. an ingress controller)
        - ipBlock:
            cidr: 0.0.0.0/0              # any IP outside the cluster (load balancer, node port)
      ports:
        {{- range $svc.ports }}
        {{- if eq (default "cluster" .expose) "public" }}
        - port: {{ .containerPort }}
          protocol: {{ default "TCP" .protocol }}
        {{- end }}
        {{- end }}
    {{- end }}
    {{- if $svc.allowFrom }}
    - from:
        {{- range $from := $svc.allowFrom }}
        - podSelector:
            matchLabels:
              {{- include "app.selectorLabels" (list $root $from) | nindent 14 }}
        {{- end }}
      ports:
        {{- range $svc.ports }}
        {{- if ne (default "cluster" .expose) "none" }}
        - port: {{ .containerPort }}
          protocol: {{ default "TCP" .protocol }}
        {{- end }}
        {{- end }}
    {{- end }}
  {{- else }}
  ingress: []                            # nothing may reach this service
  {{- end }}
{{- end }}
{{- end }}
