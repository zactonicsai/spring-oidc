# Secret = the manager's locked drawer. NEVER commit real values.
# The deploy script builds the real one from secrets.env instead:
#   kubectl -n python-demo create secret generic python-demo-api-secrets --from-env-file=secrets.env
apiVersion: v1
kind: Secret
metadata:
  name: python-demo-api-secrets
  namespace: python-demo
type: Opaque
stringData:
  API_TOKEN: "change-me"
