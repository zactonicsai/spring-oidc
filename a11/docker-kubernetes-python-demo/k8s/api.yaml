apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-demo-api
  namespace: python-demo
  labels: { app.kubernetes.io/name: python-demo, app.kubernetes.io/component: api }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: python-demo, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: python-demo, app.kubernetes.io/component: api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: python-demo-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: APP_NAME, value: python-demo }
            - { name: SERVICE_NAME, value: api }
            - { name: APP_VERSION, value: "1.0.0" }
          envFrom:
            - configMapRef: { name: python-demo-api-config }
            - secretRef:    { name: python-demo-api-secrets }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: python-demo-api
  namespace: python-demo
spec:
  type: ClusterIP            # cluster-only: no public exposure
  selector: { app.kubernetes.io/name: python-demo, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 80, targetPort: http }]
