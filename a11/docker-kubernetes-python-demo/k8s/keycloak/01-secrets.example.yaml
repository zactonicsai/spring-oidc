# EXAMPLE ONLY — scripts/keycloak.sh deploy creates these with random passwords.
# To set your own:  kubectl -n keycloak create secret generic keycloak-admin \
#   --from-literal=username=admin --from-literal=password='...'
apiVersion: v1
kind: Secret
metadata: { name: keycloak-admin, namespace: keycloak }
type: Opaque
stringData:
  username: admin
  password: change-me
---
apiVersion: v1
kind: Secret
metadata: { name: keycloak-db, namespace: keycloak }
type: Opaque
stringData:
  username: keycloak
  password: change-me-db
  database: keycloak
