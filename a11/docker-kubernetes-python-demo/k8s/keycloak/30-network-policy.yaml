# Same pattern as the demo app: lock every door, then hand out badges.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: keycloak }
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: keycloak-allow, namespace: keycloak }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/component: server }
  policyTypes: ["Ingress"]
  ingress:
    - from:                          # the exposed port: anyone (load balancer, other namespaces, port-forward)
        - namespaceSelector: {}
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports: [{ port: 8080 }]
    - from:                          # cluster gossip between replicas
        - podSelector:
            matchLabels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/component: server }
      ports: [{ port: 7800 }]
    - from:                          # health/metrics: kube-system (probes on some CNIs) + Prometheus in "monitoring"
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ port: 9000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: keycloak-db-allow, namespace: keycloak }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/component: db }
  policyTypes: ["Ingress"]
  ingress:
    - from:                          # only Keycloak may talk to the database
        - podSelector:
            matchLabels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/component: server }
      ports: [{ port: 5432 }]
