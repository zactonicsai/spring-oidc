# Command pod: namespace, ServiceAccount and Deployment. Rendered by scripts/command-pod.sh
# (placeholders: ${COMMAND_POD_NS} ${COMMAND_POD_IMAGE} ${REPLICAS}). RBAC lives in rbac.yaml.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ${COMMAND_POD_NS}
  labels:
    app.kubernetes.io/name: command-pod
    app.kubernetes.io/managed-by: podkit
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: command-pod
  namespace: ${COMMAND_POD_NS}
  labels:
    app.kubernetes.io/name: command-pod
    app.kubernetes.io/managed-by: podkit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-pod
  namespace: ${COMMAND_POD_NS}
  labels:
    app.kubernetes.io/name: command-pod
    app.kubernetes.io/managed-by: podkit
spec:
  replicas: ${REPLICAS}          # 1 while deploying, 0 when idle
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: command-pod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: command-pod
        app.kubernetes.io/managed-by: podkit
    spec:
      serviceAccountName: command-pod
      automountServiceAccountToken: true   # kubectl/ansible inside the pod use this token
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: command-pod
          image: ${COMMAND_POD_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          workingDir: /work
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}        # scratch only: nothing persists, nothing to pay for
