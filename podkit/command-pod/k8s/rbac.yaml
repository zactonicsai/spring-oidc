# Namespaced permissions for the command pod in ONE target namespace (applied once per namespace).
# Placeholders: ${TARGET_NAMESPACE} ${COMMAND_POD_NS}. No cluster-wide permissions.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: command-pod-configure
  namespace: ${TARGET_NAMESPACE}
  labels:
    app.kubernetes.io/name: command-pod
    app.kubernetes.io/managed-by: podkit
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: command-pod-configure
  namespace: ${TARGET_NAMESPACE}
  labels:
    app.kubernetes.io/name: command-pod
    app.kubernetes.io/managed-by: podkit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: command-pod-configure
subjects:
  - kind: ServiceAccount
    name: command-pod
    namespace: ${COMMAND_POD_NS}
