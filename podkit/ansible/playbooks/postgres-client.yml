---
# Post-deploy step for a pod that talks to an external PostgreSQL database.
#   1. reads the database password from the Kubernetes Secret the deploy step created
#   2. checks the database is reachable and the credentials work (from the command pod)
#   3. optionally runs a bootstrap SQL file (schema, idempotent statements only)
#   4. pushes a small runtime config file into every running pod and verifies from inside
#
# Variables come from build/<provider>/<name>/ansible/vars.yml (generated by podgen);
# build_dir is passed by scripts/configure.sh.
- name: Configure and verify a pod that uses an external PostgreSQL database
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    check_connectivity: true
    bootstrap_sql: ""
    runtime_config_path: /tmp/database.conf
    pg_port: 5432
    pg_sslmode: require
    pg_connect_timeout: 10
  tasks:
    - name: "Read the database password from Secret {{ namespace }}/{{ password_secret }}"
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: "{{ namespace }}"
        name: "{{ password_secret }}"
      register: pw_secret
      no_log: true

    - name: Make sure the Secret and key exist
      ansible.builtin.assert:
        that:
          - pw_secret.resources | length > 0
          - password_secret_key in (pw_secret.resources[0].data | default({}))
        fail_msg: >-
          Secret {{ namespace }}/{{ password_secret }} with key {{ password_secret_key }} not found.
          deploy.sh creates it from the cloud secret store; check spec.externalServices.postgres.

    - name: Keep the connection settings together (password stays in memory only)
      ansible.builtin.set_fact:
        pg_env:
          PGHOST: "{{ pg_host }}"
          PGPORT: "{{ pg_port | string }}"
          PGDATABASE: "{{ pg_database }}"
          PGUSER: "{{ pg_user }}"
          PGSSLMODE: "{{ pg_sslmode }}"
          PGPASSWORD: "{{ pw_secret.resources[0].data[password_secret_key] | b64decode }}"
          PGCONNECT_TIMEOUT: "{{ pg_connect_timeout | string }}"
      no_log: true

    # ---- reachability + credentials ----------------------------------------------------------
    - name: "Check the database accepts connections ({{ pg_host }}:{{ pg_port }})"
      ansible.builtin.command:
        cmd: pg_isready -h {{ pg_host }} -p {{ pg_port }} -d {{ pg_database }} -U {{ pg_user }} -t {{ pg_connect_timeout }}
      when: check_connectivity | bool
      changed_when: false

    - name: Check the credentials work (SELECT 1)
      ansible.builtin.command:
        cmd: psql -X -A -t -c "select 1"
      environment: "{{ pg_env }}"
      when: check_connectivity | bool
      changed_when: false
      register: select_one
      no_log: true

    - name: Fail with a readable message if the login failed
      ansible.builtin.assert:
        that: select_one is skipped or select_one.stdout | trim == "1"
        fail_msg: "psql could not run SELECT 1 as {{ pg_user }} on {{ pg_host }}/{{ pg_database }} (check password, sslmode and network access)"

    # ---- optional schema bootstrap ---------------------------------------------------------------
    - name: "Run bootstrap SQL {{ bootstrap_sql }} (write idempotent SQL: CREATE TABLE IF NOT EXISTS ...)"
      ansible.builtin.command:
        cmd: psql -X -v ON_ERROR_STOP=1 -f {{ bootstrap_sql }}
      environment: "{{ pg_env }}"
      when: bootstrap_sql | length > 0
      register: bootstrap
      changed_when: true

    - name: Show the bootstrap output
      ansible.builtin.debug:
        msg: "{{ bootstrap.stdout_lines | default([]) }}"
      when: bootstrap_sql | length > 0

    # ---- runtime config inside the running pods ------------------------------------------------
    - name: "Find the running pods of {{ app_name }}"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors: ["{{ target_selector }}"]
        field_selectors: ["status.phase=Running"]
      register: pods

    - name: Make sure at least one pod is running
      ansible.builtin.assert:
        that: pods.resources | length > 0
        fail_msg: "no running pod matches {{ target_selector }} in {{ namespace }}"

    - name: Render the runtime config (connection settings only; the password comes from the Secret)
      ansible.builtin.tempfile:
        state: file
        suffix: -database.conf
      register: runtime_conf

    - name: Write the runtime config
      ansible.builtin.copy:
        dest: "{{ runtime_conf.path }}"
        mode: "0644"
        content: |
          # generated by podkit postgres-client.yml on {{ now(utc=true).isoformat() }}
          host={{ pg_host }}
          port={{ pg_port }}
          dbname={{ pg_database }}
          user={{ pg_user }}
          sslmode={{ pg_sslmode }}

    - name: Copy the runtime config into each pod (the image needs `tar`)
      kubernetes.core.k8s_cp:
        namespace: "{{ namespace }}"
        pod: "{{ item.metadata.name }}"
        container: "{{ container }}"
        local_path: "{{ runtime_conf.path }}"
        remote_path: "{{ runtime_config_path }}"
      loop: "{{ pods.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Verify from inside each pod (file present; pg_isready when the image has it)
      kubernetes.core.k8s_exec:
        namespace: "{{ namespace }}"
        pod: "{{ item.metadata.name }}"
        container: "{{ container }}"
        command: >-
          sh -c 'test -s "{{ runtime_config_path }}" || exit 1;
          if command -v pg_isready >/dev/null 2>&1; then pg_isready -h "$PGHOST" -p "$PGPORT" -t {{ pg_connect_timeout }};
          else echo "pg_isready not in image; skipped in-pod check"; fi'
      loop: "{{ pods.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      register: in_pod

    - name: In-pod results
      ansible.builtin.debug:
        msg: "{{ item.item.metadata.name }}: {{ item.stdout | default('') | trim }}"
      loop: "{{ in_pod.results }}"
      loop_control:
        label: "{{ item.item.metadata.name }}"

    - name: Remove the temporary file
      ansible.builtin.file:
        path: "{{ runtime_conf.path }}"
        state: absent
