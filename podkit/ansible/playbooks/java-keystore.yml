---
# Pod-to-pod mTLS: issue a certificate from a shared CA and publish a Java keystore + truststore
# as Kubernetes Secrets. Runs on localhost (inside the command pod, or on your machine with
# CONFIGURE_VIA=local) and only talks to the cluster API. Idempotent: existing stores are kept
# unless rotate=true (e.g. ./configure.sh -e rotate=true).
#
# Secrets produced (all in `namespace`):
#   ca_secret          ca.crt, ca.key                          shared by every pod in the namespace
#   truststore_secret  truststore.jks, truststore.password, ca.crt   shared, trusts the CA
#   keystore_secret    keystore.jks, keystore.password, tls.crt     one per pod (server or client)
#
# Variables come from build/<provider>/<name>/ansible/vars.yml (generated by podgen).
- name: Java keystore and truststore for pod-to-pod mTLS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    rotate: false
    is_server: false
    dns_names: []
    restart_deployments: []
    validity_days: 365
    ca_validity_days: "{{ (validity_days | int) * 5 }}"
    ca_alias: podkit-ca
    common_labels:
      app.kubernetes.io/managed-by: podkit
      podkit.dev/component: mtls
  tasks:
    - name: Look up the CA, keystore and truststore secrets
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: "{{ namespace }}"
        name: "{{ item }}"
      loop:
        - "{{ ca_secret }}"
        - "{{ keystore_secret }}"
        - "{{ truststore_secret }}"
      register: existing
      no_log: true

    - name: Decide what needs to be (re)built
      ansible.builtin.set_fact:
        ca_exists: "{{ existing.results[0].resources | length > 0 }}"
        keystore_exists: "{{ existing.results[1].resources | length > 0 }}"
        truststore_exists: "{{ existing.results[2].resources | length > 0 }}"

    - name: Set work items
      ansible.builtin.set_fact:
        issue_needed: "{{ rotate | bool or not keystore_exists or not ca_exists }}"
        truststore_needed: "{{ rotate | bool or not truststore_exists or not ca_exists }}"

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ subject_name }} ({{ 'server' if is_server | bool else 'client' }}):
          CA {{ 'exists' if ca_exists else 'will be created' }},
          keystore {{ 'will be issued' if issue_needed else 'kept' }},
          truststore {{ 'will be built' if truststore_needed else 'kept' }}.

    - name: Nothing to do (use rotate=true to reissue)
      ansible.builtin.meta: end_play
      when: not issue_needed and not truststore_needed

    - name: Create a private working directory
      ansible.builtin.tempfile:
        state: directory
        suffix: -podkit-tls
      register: work

    - name: Issue certificate and build the stores
      block:
        # ---- CA ---------------------------------------------------------------------------
        - name: Write the existing CA to disk
          ansible.builtin.copy:
            content: "{{ existing.results[0].resources[0].data[item] | b64decode }}"
            dest: "{{ work.path }}/{{ item }}"
            mode: "0600"
          loop: ["ca.crt", "ca.key"]
          when: ca_exists
          no_log: true

        - name: Create a new CA (EC P-256, self-signed)
          ansible.builtin.shell:
            chdir: "{{ work.path }}"
            cmd: |
              set -e
              openssl ecparam -name prime256v1 -genkey -noout -out ca.key
              openssl req -x509 -new -key ca.key -sha256 -days {{ ca_validity_days }} \
                -subj "/CN=podkit mTLS CA ({{ namespace }})" -out ca.crt
              chmod 0600 ca.key
          when: not ca_exists
          changed_when: true

        - name: Read the CA files
          ansible.builtin.slurp:
            src: "{{ work.path }}/{{ item }}"
          loop: ["ca.crt", "ca.key"]
          register: ca_files
          no_log: true

        - name: Store the CA secret
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: "{{ ca_secret }}"
                namespace: "{{ namespace }}"
                labels: "{{ common_labels | combine({'podkit.dev/role': 'ca'}) }}"
              type: Opaque
              data:
                ca.crt: "{{ ca_files.results[0].content }}"
                ca.key: "{{ ca_files.results[1].content }}"
          when: not ca_exists
          no_log: true

        # ---- leaf certificate + keystore -------------------------------------------------
        - name: Generate the keystore password
          ansible.builtin.set_fact:
            keystore_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
            san: "{{ (dns_names if dns_names | length > 0 else [subject_name]) | map('regex_replace', '^', 'DNS:') | join(',') }}"
          when: issue_needed
          no_log: true

        - name: Issue the certificate and build keystore.jks
          ansible.builtin.shell:
            chdir: "{{ work.path }}"
            cmd: |
              set -e
              cat > ext.cnf <<CNF
              [req]
              distinguished_name = dn
              prompt = no
              [dn]
              CN = {{ subject_name }}
              [v3_ext]
              basicConstraints = CA:FALSE
              keyUsage = digitalSignature, keyEncipherment
              extendedKeyUsage = {{ 'serverAuth, clientAuth' if is_server | bool else 'clientAuth' }}
              subjectAltName = {{ san }}
              CNF
              openssl ecparam -name prime256v1 -genkey -noout -out tls.key
              openssl req -new -key tls.key -config ext.cnf -out tls.csr
              openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
                -days {{ validity_days }} -sha256 -extfile ext.cnf -extensions v3_ext -out tls.crt
              openssl pkcs12 -export -in tls.crt -inkey tls.key -certfile ca.crt \
                -name "{{ subject_name }}" -out keystore.p12 -passout env:STORE_PASS
              keytool -importkeystore -noprompt \
                -srckeystore keystore.p12 -srcstoretype PKCS12 -srcstorepass:env STORE_PASS \
                -destkeystore keystore.jks -deststoretype JKS -deststorepass:env STORE_PASS -destkeypass:env STORE_PASS
              rm -f keystore.p12 tls.key tls.csr
          environment:
            STORE_PASS: "{{ keystore_password }}"
          when: issue_needed
          changed_when: true
          no_log: true

        - name: Read keystore.jks and tls.crt
          ansible.builtin.slurp:
            src: "{{ work.path }}/{{ item }}"
          loop: ["keystore.jks", "tls.crt"]
          register: keystore_files
          when: issue_needed
          no_log: true

        - name: Store the keystore secret
          kubernetes.core.k8s:
            state: present
            force: true
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: "{{ keystore_secret }}"
                namespace: "{{ namespace }}"
                labels: "{{ common_labels | combine({'podkit.dev/role': 'keystore', 'app.kubernetes.io/name': subject_name}) }}"
                annotations:
                  podkit.dev/subject: "{{ subject_name }}"
                  podkit.dev/san: "{{ san }}"
                  podkit.dev/issued-at: "{{ now(utc=true).isoformat() }}"
              type: Opaque
              data:
                keystore.jks: "{{ keystore_files.results[0].content }}"
                keystore.password: "{{ keystore_password | b64encode }}"
                tls.crt: "{{ keystore_files.results[1].content }}"
          when: issue_needed
          no_log: true

        # ---- truststore -------------------------------------------------------------------
        - name: Generate the truststore password
          ansible.builtin.set_fact:
            truststore_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
          when: truststore_needed
          no_log: true

        - name: Build truststore.jks from the CA
          ansible.builtin.command:
            chdir: "{{ work.path }}"
            cmd: keytool -importcert -noprompt -alias {{ ca_alias }} -file ca.crt -keystore truststore.jks -storetype JKS -storepass:env STORE_PASS
          environment:
            STORE_PASS: "{{ truststore_password }}"
          when: truststore_needed
          changed_when: true
          no_log: true

        - name: Read truststore.jks
          ansible.builtin.slurp:
            src: "{{ work.path }}/truststore.jks"
          register: truststore_file
          when: truststore_needed
          no_log: true

        - name: Store the truststore secret
          kubernetes.core.k8s:
            state: present
            force: true
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: "{{ truststore_secret }}"
                namespace: "{{ namespace }}"
                labels: "{{ common_labels | combine({'podkit.dev/role': 'truststore'}) }}"
              type: Opaque
              data:
                truststore.jks: "{{ truststore_file.content }}"
                truststore.password: "{{ truststore_password | b64encode }}"
                ca.crt: "{{ ca_files.results[0].content }}"
          when: truststore_needed
          no_log: true

        # ---- roll running pods so they load the new material ------------------------------
        - name: Find deployments to restart
          kubernetes.core.k8s_info:
            kind: Deployment
            namespace: "{{ namespace }}"
            name: "{{ item }}"
          loop: "{{ restart_deployments }}"
          register: deployments
          when: issue_needed

        - name: Restart deployments that are already running
          kubernetes.core.k8s:
            state: patched
            kind: Deployment
            namespace: "{{ namespace }}"
            name: "{{ item.item }}"
            definition:
              spec:
                template:
                  metadata:
                    annotations:
                      podkit.dev/restarted-at: "{{ now(utc=true).isoformat() }}"
          loop: "{{ deployments.results | default([]) }}"
          loop_control:
            label: "{{ item.item | default('') }}"
          when: issue_needed and (item.resources | default([])) | length > 0
      always:
        - name: Remove the working directory (private keys never leave it)
          ansible.builtin.file:
            path: "{{ work.path }}"
            state: absent

    - name: Done
      ansible.builtin.debug:
        msg: >-
          {{ namespace }}/{{ keystore_secret }} ({{ 'issued' if issue_needed else 'unchanged' }}),
          {{ namespace }}/{{ truststore_secret }} ({{ 'rebuilt' if truststore_needed else 'unchanged' }}).
          Pods read KEYSTORE_PATH / TRUSTSTORE_PATH and the *_PASSWORD env vars.
